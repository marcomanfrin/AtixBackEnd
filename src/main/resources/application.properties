spring.application.name = AtixBackEnd
spring.config.import=optional:file:env.properties
#server
server.port=3333
server.servlet.context-path=/api

# POSTGRES
spring.datasource.url = jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB_NAME}
spring.datasource.username = ${PG_USERNAME}
spring.datasource.password = ${PG_PASSWORD}
spring.datasource.driver-class-name = org.postgresql.Driver

# HIBERNATE
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = false
spring.jpa.properties.hibernate.format_sql = true

# MINIO
minio.url=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:${minio.url}}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:adminpassword}
minio.bucket=${MINIO_BUCKET:atix-attachments}

# CLOUDINARY
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.apikey=${CLOUDINARY_KEY}
cloudinary.secret=${CLOUDINARY_SECRET}

## MAILGUN
mailgun.domain=${MAILGUN_DOMAIN}
mailgun.apiKey=${MAILGUN_API_KEY}
mailgun.sender=${MAILGUN_SENDER}

# JWT
jwt.secret=${JWT_SECRET}

# FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# GRAPHQL
spring.graphql.schema.introspection.enabled=true
spring.graphql.graphiql.enabled=true

# SENTRY Configuration
sentry.dsn=${SENTRY_DSN}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.traces-sample-rate=1.0
sentry.enable-tracing=true
sentry.send-default-pii=false
sentry.attach-stacktrace=true
sentry.attach-threads=true

# Sentry Logging Integration
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=info

# Sentry Spring Integration
sentry.exception-resolver-order=-2147483647
sentry.enable-external-configuration=true

# Disable RestClient instrumentation (not available in Spring Boot 4.0)
sentry.instrumenter=sentry

# Exclude problematic auto-configuration
spring.autoconfigure.exclude=io.sentry.spring.boot.jakarta.SentryAutoConfiguration